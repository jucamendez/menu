<body>
<h1>JavaScript if .. else</h1>

<p>A time-based greeting:</p>

<p id="demo"></p>

<script>
const hour = new Date().getHours(); 
let greeting;


if (hour < 18) {
  greeting = " La hora es: "+hour+ ". Good day";
} else {
  greeting = "Good evening";
}

document.getElementById("demo").innerHTML = greeting;
</script>
